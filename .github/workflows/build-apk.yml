name: Build Android APK

on:
  workflow_dispatch: # Manuel tetikleme için
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd client
          # Ultra-clean: Her şeyi sil ve sıfırdan kur
          rm -rf node_modules package-lock.json
          npm install --include=optional

      - name: Build Web Project
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE: /

      - name: Capacitor Sync
        run: |
          cd client
          npx cap sync android

      - name: Build Android APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saloon-app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "client/android/app/build/outputs/apk/debug/app-debug.apk"
          tag: "latest"
          name: "Latest Mobile App (APK)"
          body: "Saloon Mobil Uygulaması (Android APK). Bu sürüm her güncellemede otomatik olarak yenilenir."
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true

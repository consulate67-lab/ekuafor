name: Server CI

# Server tarafında her push/PR'da lint + build + DB migration + test çalıştır.
# Postgres service ile test DB oluşturulur, Drizzle schema uygulanır, vitest çalışır.

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'

# Aynı PR için iptal edilen in-flight run'ları iptal et (tasarruf)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build, migrate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: saloon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/saloon_test
      JWT_SECRET: test_jwt_secret_with_32_chars_minimum_for_ci_testing_only
      ALLOWED_ORIGINS: http://localhost:5173
      NODE_ENV: test
      PORT: 3001
      # Opsiyonel env'ler CI'da boş bırakılır
      TURKIYE_API_BASE_URL: https://turkiyeapi.dev/api/v1
      SMTP_HOST: localhost
      SMTP_PORT: "587"
      SMTP_SECURE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint (TypeScript strict check)
        working-directory: server
        run: npx tsc --noEmit

      - name: Build
        working-directory: server
        run: npm run build

      - name: Apply Drizzle schema to test DB
        working-directory: server
        run: npx drizzle-kit push --force

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Coverage report
        if: success()
        working-directory: server
        run: npm run test:cov 2>/dev/null || true

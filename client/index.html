<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./app-icon.png" />
  <link rel="apple-touch-icon" href="./app-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Saloon" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="QR ile eklediğiniz işletmelerden online randevu. Ana ekrana ekleyince uygulama gibi açılır." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Saloon" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Saloon — Online Randevu</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- Service Worker tamamen devre disi (2026-09-27): stale cache problemi (eski CORS 500 response cache temizlenmedi). PWA offline destegi ileride tekrar eklenebilir. SPA redirect kaldirildi (Capacitor Android WebView'da raw text olarak DOM'a dusuyordu). -->
  <script>
    // SW + cache self-cleanup (2026-09-27): eski SW'leri ve Cache Storage entry'lerini
    // bir dahaki sayfa yuklemesinde sil. Boylece stale d79c2a bundle'lari bir daha
    // yuklenmez. Bu script her sayfa yuklmesinde kosar ama no-op olur (temizlik sonrasi).
    (function () {
      if (!('serviceWorker' in navigator)) return;
      try {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister().catch(function () {}); });
        });
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k).catch(function () {}); });
          });
        }
      } catch (_) { /* guvenli: en kotu durumda sessiz gec */ }
    })();
    // QR kamera: ?c=5 hemen #/firma/5'e (bundle yuklenmeden)
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var c = q.get('c') || q.get('firma') || q.get('company');
        if (!c || !/^\d+$/.test(c)) return;
        var ref = q.get('ref') || 'qr';
        var install = (q.get('install') === '1' || ref === 'qr') ? '&install=1' : '';
        location.replace(location.pathname + '#/firma/' + c + '?ref=' + encodeURIComponent(ref) + install);
      } catch (_) { /* ignore */ }
    })();
  </script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

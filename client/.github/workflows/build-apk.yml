name: Build Android APK & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: cross-env VITE_BASE=/ npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ekuafor-v${{ steps.version.outputs.VERSION }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ekuafor-apk-v${{ steps.version.outputs.VERSION }}
          path: apk-output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: apk-output/*.apk
          generate_release_notes: false
          body: |
            ## 📱 Android APK

            APK dosyasını indirmek için aşağıdaki dosyaya tıklayın.

            ### Bu sürümdeki değişiklikler
            - ✅ Randevu onayında otomatik SMS (NetGSM entegrasyonu)
            - ✅ Randevu formu sadeleştirildi — telefon numarası OTP ile otomatik alınıyor
            - ✅ Randevularım "Geri" butonu artık ana sayfaya döner
            - ✅ Firma SMS ayarları NetGSM odaklı basitleştirildi
            - ✅ Fiş OCR: "Toplam", "Top", "Tutar" anahtar kelimeleri ile akıllı tutar tespiti
            - ✅ Fiş Tara butonu modern tasarım
            - ✅ Bildirim izni ilk açılışta isteniyor
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
